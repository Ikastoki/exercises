<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Exercises">
  <defs>
    <linearGradient id="bg-exercises-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f8f9fa"/>
      <stop offset="0.7" stop-color="#e9ecef"/>
      <stop offset="1"   stop-color="#dee2e6"/>
    </linearGradient>
    <linearGradient id="glow-exercises-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5a030" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c5a030" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c5a030" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c5a030" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c5a030" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="marco-exercises-light">
      <rect width="600" height="150" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#marco-exercises-light)">
    <!-- Fondo -->
    <rect width="600" height="150" fill="url(#bg-exercises-light)"/>

    <!-- Resplandor central sutil -->
    <ellipse cx="300" cy="75" rx="220" ry="70" fill="url(#center-glow-light)"/>

    <!-- Línea horizontal dorada tenue (estilo "línea de código") -->
    <rect x="0" y="74" width="600" height="1" fill="url(#glow-exercises-light)" opacity="0.5"/>

    <!-- Símbolos de código flotantes (como "estrellas" de código) -->
    <g font-family="'Fira Code', 'Courier New', monospace" fill="#6b7280">
      <!-- Capa trasera: muy sutiles -->
      <text x="40"  y="30"  font-size="11" opacity="0.25">{</text>
      <text x="95"  y="120" font-size="10" opacity="0.20">}</text>
      <text x="150" y="22"  font-size="9"  opacity="0.28">&lt;/&gt;</text>
      <text x="210" y="130" font-size="10" opacity="0.20">()</text>
      <text x="280" y="18"  font-size="9"  opacity="0.25">=&gt;</text>
      <text x="360" y="135" font-size="10" opacity="0.20">;</text>
      <text x="420" y="25"  font-size="11" opacity="0.28">[ ]</text>
      <text x="490" y="125" font-size="10" opacity="0.20">//</text>
      <text x="555" y="30"  font-size="9"  opacity="0.25">*</text>

      <!-- Capa media -->
      <text x="70"  y="60"  font-size="8"  opacity="0.30">fn</text>
      <text x="130" y="95"  font-size="8"  opacity="0.28">let</text>
      <text x="200" y="45"  font-size="8"  opacity="0.30">if</text>
      <text x="400" y="50"  font-size="8"  opacity="0.30">for</text>
      <text x="470" y="90"  font-size="8"  opacity="0.28">=&gt;</text>
      <text x="540" y="70"  font-size="8"  opacity="0.30">return</text>

      <!-- Capa frontal: un poco más visibles -->
      <text x="25"  y="105" font-size="12" opacity="0.35" fill="#c5a030">&lt;</text>
      <text x="570" y="110" font-size="12" opacity="0.35" fill="#c5a030">/&gt;</text>
      <text x="175" y="115" font-size="10" opacity="0.30">{ }</text>
      <text x="440" y="35"  font-size="10" opacity="0.30">( )</text>
    </g>

    <!-- Pequeño cursor parpadeante (detalle de terminal) -->
    <rect x="300" y="96" width="8" height="1.5" fill="#c5a030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Título -->
    <text x="300" y="65" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="26" font-weight="600" letter-spacing="10" fill="#111827">EXERCISES</text>

    <!-- Líneas doradas a los lados del título -->
    <path d="M150 57 H185" stroke="#c5a030" stroke-width="1" opacity="0.7"/>
    <path d="M415 57 H450" stroke="#c5a030" stroke-width="1" opacity="0.7"/>

    <!-- Subtítulo -->
    <text x="300" y="88" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" font-weight="500" letter-spacing="6" fill="#4b5563">EJERCICIOS DE PROGRAMACIÓN</text>

    <!-- Puntos dorados decorativos -->
    <circle cx="175" cy="85" r="1" fill="#c5a030" opacity="0.8"/>
    <circle cx="425" cy="85" r="1" fill="#c5a030" opacity="0.8"/>
  </g>

  <!-- Borde del banner -->
  <rect x="0.5" y="0.5" width="599" height="149" rx="12" fill="none" stroke="#d1d5db"/>
</svg>